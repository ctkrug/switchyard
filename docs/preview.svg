<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img"
     aria-label="A Switchyard board: a train on the lead track, three switches, and three sidings, with one switch thrown to route a car home.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1424"/>
      <stop offset="1" stop-color="#0a1220"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.42" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#0a1220" stop-opacity="0"/>
      <stop offset="1" stop-color="#04070f" stop-opacity="0.7"/>
    </radialGradient>
    <filter id="lamp" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#38bdf8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="460" rx="8" fill="url(#sky)"/>
  <rect width="800" height="460" rx="8" fill="url(#grid)"/>
  <rect width="800" height="460" rx="8" fill="url(#vignette)"/>

  <!-- lead track -->
  <line x1="70" y1="150" x2="720" y2="150" stroke="#2b3c5c" stroke-width="4"/>
  <rect x="716" y="136" width="6" height="28" fill="#7f8fae"/>

  <!-- sidings (siding 2 is thrown/amber) -->
  <!-- siding 1 -->
  <polyline points="330,150 366,230 470,230" fill="none" stroke="#2b3c5c" stroke-width="3"/>
  <circle cx="342" cy="230" r="6" fill="#38bdf8"/>
  <!-- siding 2 (active) -->
  <polyline points="440,150 476,294 590,294" fill="none" stroke="#ffb020" stroke-width="3" filter="url(#lamp)"/>
  <circle cx="452" cy="294" r="6" fill="#3ddc84"/>
  <!-- siding 3 -->
  <polyline points="550,150 586,358 690,358" fill="none" stroke="#2b3c5c" stroke-width="3"/>
  <circle cx="562" cy="358" r="6" fill="#c084fc"/>

  <!-- switch diamonds -->
  <g stroke-width="2">
    <polygon points="330,141 339,150 330,159 321,150" fill="#111c30" stroke="#7f8fae"/>
    <polygon points="440,141 449,150 440,159 431,150" fill="#ffb020" stroke="#ffb020" filter="url(#lamp)"/>
    <polygon points="550,141 559,150 550,159 541,150" fill="#111c30" stroke="#7f8fae"/>
  </g>

  <!-- delivered car sitting in the active siding -->
  <g>
    <rect x="508" y="281" width="40" height="26" rx="5" fill="#1a2740" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="539" cy="294" r="4" fill="#3ddc84"/>
  </g>

  <!-- queued train behind the throat -->
  <g>
    <rect x="230" y="137" width="40" height="26" rx="5" fill="#1a2740" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="261" cy="150" r="4" fill="#38bdf8"/>
    <rect x="184" y="137" width="40" height="26" rx="5" fill="#1a2740" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="215" cy="150" r="4" fill="#c084fc"/>
    <rect x="138" y="137" width="40" height="26" rx="5" fill="#1a2740" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="169" cy="150" r="4" fill="#ffb020"/>
  </g>

  <!-- HUD ticket, bottom-right -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace">
    <rect x="556" y="392" width="212" height="48" rx="6" fill="#111c30" stroke="#2b3c5c"/>
    <text x="574" y="414" fill="#7f8fae" font-size="11" letter-spacing="1.5">MOVES</text>
    <text x="574" y="432" fill="#ffb020" font-size="20" font-weight="600">7</text>
    <text x="666" y="414" fill="#7f8fae" font-size="11" letter-spacing="1.5">PAR</text>
    <text x="666" y="432" fill="#e7edf7" font-size="20" font-weight="600">6</text>
  </g>

  <text x="36" y="426" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="700"
        font-size="30" letter-spacing="2" fill="#ffb020">SWITCHYARD</text>
</svg>
